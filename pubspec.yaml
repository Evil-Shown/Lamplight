name: library_app
description: Library Book Reservation & Reading Room Seat Booking System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^6.2.2
  cloud_firestore: ^6.10.0
  mobile_scanner: ^7.4.2
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  audioplayers: ^6.1.0
  cloud_functions: ^6.5.0
  shared_preferences: ^2.5.6
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
